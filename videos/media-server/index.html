<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e1116; --card: #161b22; --line: #30363d; --ink: #e6edf3; --muted: #9aa4af;
        --go: #00add8; --hls: #f0883e; --dash: #a371f7; --rtc: #3fb950;
        --sans: -apple-system, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; background: var(--ground); }
      #root {
        position: relative; width: 1280px; height: 800px; font-family: var(--sans); color: var(--ink);
        background: radial-gradient(ellipse at 50% 40%, #18202b 0%, var(--ground) 70%);
      }
      .title { position: absolute; left: 40px; top: 48px; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
      .card {
        position: absolute; top: 150px; height: 346px; background: var(--card); border: 2px solid var(--line);
        border-radius: 16px; overflow: hidden; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .head {
        height: 54px; padding: 0 18px; display: flex; align-items: center; gap: 12px;
        border-bottom: 2px solid var(--line); font-size: 24px; font-weight: 700;
      }
      .screen { height: 225px; background: #000; position: relative; }
      .foot { height: 63px; padding: 0 18px; display: flex; align-items: center; gap: 10px; font: 600 22px var(--mono); color: var(--muted); }
      video { position: absolute; top: 206px; width: 396px; height: 225px; object-fit: cover; z-index: 2; }
      #camVideo { left: 42px; }
      #webVideo { left: 842px; }
      .rec {
        position: absolute; z-index: 3; left: 54px; top: 218px; padding: 4px 10px; border-radius: 6px;
        background: rgba(0, 0, 0, 0.75); font: 700 20px var(--mono); color: #fff;
      }
      .rec i { display: inline-block; width: 12px; height: 12px; margin-right: 8px; border-radius: 50%; background: #f85149; }
      .gopher { padding: 3px 8px; border-radius: 8px; background: var(--go); color: #00222b; font: 800 18px var(--mono); }
      .row { margin: 9px 12px 0; padding: 5px 14px 9px; border: 2px solid var(--line); border-radius: 12px; background: #0e1116; }
      .row b { display: block; font-size: 24px; }
      .row span { font: 20px var(--mono); color: var(--muted); }
      .meter { margin-top: 5px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
      .meter i { display: block; width: 100%; height: 100%; background: var(--go); transform-origin: left; transform: scaleX(0); }
      .lane { position: absolute; top: 311px; height: 24px; width: 60px; overflow: hidden; }
      .lane::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 4px; background: var(--line); }
      .lane i { position: absolute; left: -22px; top: 5px; width: 20px; height: 14px; border-radius: 3px; background: var(--go); }
      .dots { display: inline-flex; gap: 7px; }
      .dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--line); }
      .url { flex: 1; padding: 5px 14px; border-radius: 999px; background: #0e1116; border: 2px solid var(--line); font: 20px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
      .wait { position: absolute; inset: 0; display: grid; place-items: center; font: 22px var(--mono); color: var(--muted); }
      .protos { position: absolute; left: 40px; right: 40px; top: 560px; display: flex; gap: 20px; }
      .proto { flex: 1; padding: 20px 24px; border: 2px solid var(--line); border-radius: 16px; background: var(--card); opacity: 0.4; }
      .proto b { display: block; font-size: 34px; letter-spacing: -0.01em; }
      .proto span { display: block; margin-top: 6px; font: 21px var(--mono); color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1280" data-height="800">
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div class="title">From an IP camera to any browser</div>

        <div id="cam" class="card" style="left: 40px; width: 400px">
          <div class="head">IP camera</div>
          <div class="screen"></div>
          <div class="foot">RTSP · H.265</div>
        </div>
        <div class="rec"><i></i>REC</div>

        <div id="laneIn" class="lane" style="left: 440px" data-layout-allow-overflow><i></i><i></i></div>

        <div id="server" class="card" style="left: 500px; width: 280px">
          <div class="head"><span class="gopher">GO</span>Media server</div>
          <div class="row" id="row1"><b>Ingest</b><span>RTSP / RTP</span><div class="meter"><i></i></div></div>
          <div class="row" id="row2"><b>Transcode</b><span>HEVC → H.264</span><div class="meter"><i></i></div></div>
          <div class="row" id="row3"><b>Package</b><span>fMP4 · CENC</span><div class="meter"><i></i></div></div>
        </div>

        <div id="laneOut" class="lane" style="left: 780px" data-layout-allow-overflow><i></i><i></i></div>

        <div id="web" class="card" style="left: 840px; width: 400px">
          <div class="head"><span class="dots"><i></i><i></i><i></i></span><span class="url">vms.example/live</span></div>
          <div class="screen"><div class="wait" id="wait" data-layout-allow-occlusion>connecting…</div></div>
          <div class="foot" id="playing">H.264 · <span id="via">HLS</span></div>
        </div>

        <div class="protos">
          <div class="proto" id="pHls"><b>HLS</b><span>.m3u8 + fMP4 segments</span></div>
          <div class="proto" id="pDash"><b>DASH</b><span>.mpd + fMP4 segments</span></div>
          <div class="proto" id="pRtc"><b>WebRTC</b><span>SRTP · TURN for NAT</span></div>
        </div>
      </div>

      <video id="camVideo" class="clip" data-start="0" data-duration="12" data-track-index="1" src="cam.mp4" muted playsinline></video>
      <video id="webVideo" class="clip" data-start="5" data-duration="7" data-track-index="2" src="cam.mp4" muted playsinline></video>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const END = 12;
      // Packets run across a lane from `from` until the end of the film.
      const packets = (selector, from, period) => {
        document.querySelectorAll(selector + " i").forEach((dot, n, all) => {
          const start = from + (n * period) / all.length;
          tl.fromTo(dot, { x: 0 }, { x: 104, duration: period, ease: "none", repeat: Math.ceil((END - start) / period) }, start);
        });
      };
      const on = (id, at) => {
        tl.to(id, { borderColor: "#00add8", duration: 0.3 }, at);
        tl.to(id + " .meter i", { scaleX: 1, duration: 0.7, ease: "power2.out" }, at);
      };

      // Fade in and out so the loop has no visible cut.
      tl.fromTo("#scene", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
      tl.fromTo("#camVideo", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);
      tl.from("#cam", { y: 16, duration: 0.5, ease: "power3.out" }, 0);

      tl.from("#laneIn", { opacity: 0, duration: 0.3 }, 0.9);
      packets("#laneIn", 1.0, 0.7);
      tl.from("#server", { opacity: 0, y: 16, duration: 0.5, ease: "power3.out" }, 1.3);
      on("#row1", 1.9);
      on("#row2", 2.8);
      on("#row3", 3.7);

      tl.from("#laneOut", { opacity: 0, duration: 0.3 }, 4.4);
      packets("#laneOut", 4.5, 0.7);
      tl.from("#web", { opacity: 0, y: 16, duration: 0.5, ease: "power3.out" }, 4.4);
      tl.from(".protos", { opacity: 0, y: 16, duration: 0.5, ease: "power3.out" }, 4.6);
      tl.fromTo("#webVideo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.0);
      tl.from("#playing", { opacity: 0, duration: 0.3 }, 5.0);

      const proto = (id, name, color, at, until) => {
        tl.to(id, { opacity: 1, borderColor: color, duration: 0.25 }, at);
        tl.to("#laneOut i", { backgroundColor: color, duration: 0.25 }, at);
        tl.set("#via", { textContent: name, color }, at);
        if (until) tl.to(id, { opacity: 0.4, borderColor: "#30363d", duration: 0.25 }, until);
      };
      proto("#pHls", "HLS", "#f0883e", 5.0, 7.2);
      proto("#pDash", "DASH", "#a371f7", 7.2, 9.4);
      proto("#pRtc", "WebRTC", "#3fb950", 9.4);

      tl.to(["#scene", "#camVideo", "#webVideo"], { opacity: 0, duration: 0.4 }, END - 0.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
